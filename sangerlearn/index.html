<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SangerLearn · interactive Sanger sequencing workbench by Nesma</title>
<style>
:root{
  --bg:#f7f6f2;--surface:#ffffff;--surface2:#f0efe9;--line:#e2e0d8;--line2:#ccc9be;
  --ink:#1a1a18;--muted:#6b6860;--faint:#a09d94;
  --teal:#0f6e56;--teal-bg:#e1f5ee;--teal-mid:#1d9e75;
  --purple:#534ab7;--purple-bg:#eeedfe;
  --amber:#854f0b;--amber-bg:#faeeda;--amber-mid:#ba7517;
  --red:#a32d2d;--red-bg:#fcebeb;
  --blue:#185fa5;--blue-bg:#e6f1fb;--blue-mid:#378add;
  --bA:#1d9e75;--bC:#378add;--bG:#5f5e5a;--bT:#e24b4a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6}
.shell{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 28px;height:52px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.brand span{color:var(--teal-mid)}
.topbar-tag{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.topbar-spacer{flex:1}
.byline{font-size:12px;color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line2);transition:color .15s}
.byline:hover{color:var(--teal-mid)}
.privacy{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:5px;margin-left:12px}
.privacy .dot{width:6px;height:6px;border-radius:50%;background:var(--teal-mid);flex-shrink:0}
.divider{width:1px;height:18px;background:var(--line);margin:0 4px}
.rail{display:flex;align-items:center;padding:0 28px;height:50px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}
.rail::-webkit-scrollbar{display:none}
.rail-step{display:flex;align-items:center;gap:7px;padding:0 14px 0 0;cursor:pointer;font-size:12.5px;color:var(--faint);white-space:nowrap;transition:color .2s}
.rail-step:first-child{padding-left:0}
.rail-step.active{color:var(--ink);font-weight:500}
.rail-step.done{color:var(--teal-mid)}
.rail-step.locked{cursor:not-allowed;opacity:.35}
.rail-num{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;flex-shrink:0}
.rail-step.active .rail-num{background:var(--teal-mid);border-color:var(--teal-mid);color:#fff;font-weight:700}
.rail-step.done .rail-num{background:var(--teal-mid);border-color:var(--teal-mid);color:#fff}
.rail-step.done .rail-num::before{content:"\2713"}
.rail-step.done .rail-num span{display:none}
.rail-sep{width:20px;height:1px;background:var(--line);flex-shrink:0;margin:0 2px}
.stage{flex:1;overflow:hidden;position:relative}
.step-pane{position:absolute;inset:0;overflow-y:auto;display:none;flex-direction:column}
.step-pane.active{display:flex}
.step-inner{max-width:860px;margin:0 auto;padding:36px 28px 80px;width:100%}
.step-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-mid);margin-bottom:6px}
.step-title{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;color:var(--ink)}
.step-desc{color:var(--muted);font-size:14px;max-width:68ch;line-height:1.65;margin-bottom:28px}
.step-desc b{color:var(--ink);font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:680px){.two-col{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.card-title{font-weight:600;font-size:14px;margin-bottom:4px;color:var(--ink)}
.card-desc{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.diagram-card{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;overflow:hidden}
.diagram-card svg{width:100%;height:auto;display:block}
.terminal{background:#1a1f24;border-radius:10px;overflow:hidden;margin-bottom:16px;font-family:var(--mono)}
.term-bar{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#141920;border-bottom:1px solid #26313a}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-prompt{padding:14px 16px;font-size:12.5px;color:#8695a0}
.term-prompt .cmd{color:#46b98a;display:block;margin-bottom:8px;cursor:pointer;transition:opacity .15s}
.term-prompt .cmd:hover{opacity:.8}
.term-prompt .cmd::before{content:"> ";color:#59656f}
.term-output{padding:0 16px 16px;font-size:12px;color:#8695a0;white-space:pre-wrap;line-height:1.6;display:none}
.term-output.visible{display:block}
.term-output .hi{color:#46b98a}
.term-output .warn{color:#d8925a}
.term-output .val{color:#dbe4ea}
.run-btn{display:inline-flex;align-items:center;gap:6px;background:var(--teal-mid);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:12.5px;font-family:var(--mono);cursor:pointer;margin:8px 0 0 16px;transition:filter .15s}
.run-btn:hover{filter:brightness(1.1)}
.run-btn.running{background:var(--faint)}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-pass{background:var(--teal-bg);color:var(--teal)}
.badge-warn{background:var(--amber-bg);color:var(--amber)}
.badge-fail{background:var(--red-bg);color:var(--red)}
.badge-info{background:var(--purple-bg);color:var(--purple)}
.step-nav{display:flex;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
.btn{border:none;font-weight:600;padding:9px 20px;border-radius:7px;cursor:pointer;font-size:13.5px;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--teal-mid);color:#fff}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn-secondary:hover:not(:disabled){border-color:var(--teal-mid);color:var(--teal)}
.nav-spacer{flex:1}
.viz-card{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.viz-title{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:8px}
.qcell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
.qcell-val{font-size:18px;font-weight:700;font-family:var(--mono)}
.qcell-lbl{font-size:10px;color:var(--muted);margin-top:2px}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.dash-cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.dash-val{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--teal-mid)}
.dash-lbl{font-size:11.5px;color:var(--muted);margin-top:2px}
.tip{font-size:12.5px;color:var(--faint);font-style:italic;margin-top:8px}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:20px 0 8px}
code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
a.dl{font-family:var(--mono);font-size:12px;color:var(--teal);text-decoration:none;border-bottom:1px dotted var(--line2)}
a.dl:hover{color:var(--teal-mid)}
.base{font-family:var(--mono);font-weight:700;padding:1px 6px;border-radius:5px;color:#fff}
.b-A{background:var(--bA)}.b-C{background:var(--bC)}.b-G{background:var(--bG)}.b-T{background:var(--bT)}
.toggle-row{display:flex;gap:8px;margin:12px 0}
.tg-btn{flex:1;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.15s}
.tg-btn.on{background:var(--teal-mid);color:#fff;border-color:var(--teal-mid)}
.seqin{font-family:var(--mono);font-size:16px;letter-spacing:2px;width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:9px;text-transform:uppercase;background:var(--surface);color:var(--ink)}
.seqin:focus{outline:2px solid var(--teal-mid);border-color:transparent}
.err{color:var(--red);font-size:12.5px;margin-top:6px;min-height:16px}
.pherobox{background:#12181d;border-radius:9px;padding:12px 6px 4px;overflow-x:auto;margin-top:6px}
.pherobox svg{display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--faint);margin-top:8px;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.ladder{background:#12181d;border-radius:9px;padding:12px 14px;color:#c9d4dd;font-family:var(--mono);font-size:12px;overflow-x:auto;line-height:1.7}
.mini-btn{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);transition:.15s}
.mini-btn:hover{border-color:var(--teal-mid);color:var(--teal)}
.mini-btn.primary{background:var(--teal-mid);color:#fff;border-color:var(--teal-mid)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 13px;margin-bottom:7px;cursor:pointer;font:inherit;font-size:13.5px;transition:.12s;color:var(--ink)}
.opt:hover{border-color:var(--teal-mid)}
.opt.correct{background:var(--teal-bg);border-color:var(--teal-mid);color:var(--teal)}
.opt.wrong{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.qfb{font-size:12.5px;margin-top:6px;min-height:16px;color:var(--muted)}
.classcard{display:grid;grid-template-columns:auto 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.classcard>div{border-bottom:1px solid var(--line);padding:12px 14px}
.classcard>div:nth-last-child(-n+2){border-bottom:0}
.classcard .lvl{background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center}
.classcard .desc{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="shell">
<div class="topbar">
  <div class="brand">Sanger<span>Learn</span></div>
  <span class="topbar-tag">SANGER SEQUENCING WORKBENCH</span>
  <div class="topbar-spacer"></div>
  <a class="byline" href="https://meeg-lab.github.io/team/nesma-ab/" target="_blank" rel="noopener">by <strong>Nesma</strong> &#8599;</a>
  <div class="divider"></div>
  <div class="privacy"><span class="dot"></span> runs in your browser</div>
</div>
<div class="rail" id="rail">
  <div class="rail-step active" onclick="railClick(0)"><div class="rail-num"><span>1</span></div>Introduction</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(1)"><div class="rail-num"><span>2</span></div>Chemistry</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(2)"><div class="rail-num"><span>3</span></div>The reaction</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(3)"><div class="rail-num"><span>4</span></div>Separation</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(4)"><div class="rail-num"><span>5</span></div>Read the trace</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(5)"><div class="rail-num"><span>6</span></div>Simulator</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(6)"><div class="rail-num"><span>7</span></div>Load read</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(7)"><div class="rail-num"><span>8</span></div>Base calling</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(8)"><div class="rail-num"><span>9</span></div>Quality &amp; trim</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(9)"><div class="rail-num"><span>10</span></div>Chromatogram</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(10)"><div class="rail-num"><span>11</span></div>Contig</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(11)"><div class="rail-num"><span>12</span></div>Alignment</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(12)"><div class="rail-num"><span>13</span></div>Report</div>
  <div class="rail-sep"></div>
  <div class="rail-step locked" onclick="railClick(13)"><div class="rail-num"><span>14</span></div>Quiz</div>
</div>
<div class="stage" id="stage"></div>
</div>
<script src="app.js"></script>
</body>
</html>

---
layout: default
---
<header class="page-header">
  <div class="wrap">
    <span class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</span>
    <h1>{{ page.title }}</h1>
  </div>
</header>

<article class="section">
  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
    <p style="margin-top:3rem;"><a href="{{ '/news/' | relative_url }}" class="btn btn-ghost">← All news</a></p>
  </div>
</article>

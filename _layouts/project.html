---
layout: default
---
<header class="page-header">
  <div class="wrap">
    <span class="eyebrow">{{ page.area | default: "Research project" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </div>
</header>

<section class="section">
  <div class="wrap">
    <div class="prose">
      {{ content }}
    </div>
    <p style="margin-top:3rem;"><a href="{{ '/research/' | relative_url }}" class="btn btn-ghost">← All projects</a></p>
  </div>
</section>

<header class="site-header">
  <div class="wrap">
    <a href="{{ '/' | relative_url }}" class="brand">

  <span class="brand-text">{{ site.title }}<span class="mark">.</span></span>
</a>
    <nav class="nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>

      <a href="{{ '/news/' | relative_url }}"{% if page.url contains '/news' %} class="active"{% endif %}>News</a>

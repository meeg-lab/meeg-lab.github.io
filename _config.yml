title: "MEEG Lab"
tagline: "Microbial Ecology and Environmental Genomics Lab"
description: "We study how microbiota shape environmental, plant, animal, and human health, with a focus on arid ecosystems, mycorrhizal symbiosis, and the response of microbial communities to global change."
url: "https://meeg-lab.github.io"
baseurl: ""

pi_name: "Dr. Sunil Mundra"
pi_title: "Assistant Professor"
pi_email: "sunilmundra@uaeu.ac.ae"
pi_office: "Department of Biology, College of Science"
pi_department: "Department of Biology"
pi_university: "United Arab Emirates University"
pi_phone: "+971-(3)-713-6341"

github_username: "meeg-lab"
twitter_username: "msunilmundra"

markdown: kramdown
highlighter: rouge
permalink: /:collection/:path/

collections:
  team:
    output: true
    permalink: /team/:path/
  projects:
    output: true
    permalink: /research/:path/
  teaching:
    output: true
    permalink: /teaching/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "teaching"

paginate: 5
paginate_path: "/news/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

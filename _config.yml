# Site settings
title: "MEEG Lab"
tagline: "Microbial Ecology & Environmental Genomics"
description: >-
  We study how microbiota shape environmental, plant, animal, and human health,
  with a focus on arid ecosystems, mycorrhizal symbiosis, and the response of
  microbial communities to global change.
url: "https://meeg-lab.github.io"
baseurl: ""

# Author / PI
pi:
  name: "Dr. Sunil Mundra"
  title: "Assistant Professor"
  email: "sunilmundra@uaeu.ac.ae"
  office: "Department of Biology, College of Science"
  department: "Department of Biology"
  university: "United Arab Emirates University"
  phone: "+971-(3)-713-6341"

# Social / external
github_username: "meeg-lab"
twitter_username: "msunilmundra"
google_scholar: ""
orcid: ""

# Build
markdown: kramdown
highlighter: rouge
permalink: /:collection/:path/

# Collections
collections:
  team:
    output: true
    permalink: /team/:path/
  publications:
    output: false
  projects:
    output: true
    permalink: /research/:path/
  teaching:
    output: true
    permalink: /teaching/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "person"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "teaching"

paginate: 5
paginate_path: "/news/page:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
